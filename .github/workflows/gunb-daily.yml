name: Dane GUNB (codziennie)

# Co noc pobiera pliki RWDZ z wyszukiwarka.gunb.gov.pl, filtruje (hale/obiekty kubaturowe,
# ostatnie 365 dni) i publikuje wynik na gałęzi „data” (nadpisywanej — historia nie rośnie).
# Ręczne uruchomienie: zakładka Actions → „Dane GUNB (codziennie)” → Run workflow.

on:
  schedule:
    - cron: "17 3 * * *"   # 4:17 zimą / 5:17 latem czasu polskiego, po nocnej aktualizacji GUNB
  workflow_dispatch:
    inputs:
      regions:
        description: "Województwa (po przecinku), np. mazowieckie,lodzkie"
        default: "mazowieckie"

permissions:
  contents: write

concurrency:
  group: gunb-daily
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pobierz i przefiltruj dane GUNB
        env:
          REGIONS: ${{ github.event.inputs.regions || 'mazowieckie' }}
        run: python gunb_loader.py --regions "$REGIONS" --days 365 --out-dir out

      - name: Opublikuj na gałęzi data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Dane GUNB $(date -u +%F)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
